<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LessonWeave · 公共媒体规范</title><link rel="stylesheet" href="/media-renderer.css"><style>:root{--paper:#fafbf8;--line:#d6dbd4;--muted:#69736b;--soft:#e9ede6;--accent:#496658}body{margin:0;background:var(--paper);color:#28332c;font:16px/1.85 system-ui}aside{position:fixed;width:180px;inset:0 auto 0 0;padding:24px;border-right:1px solid var(--line);overflow:auto}a{color:inherit}aside a{display:block;margin:12px 0}main{max-width:900px;margin-left:230px;padding:25px 36px}h1{font-size:25px}h2{font-size:22px;margin-top:45px}header p{color:var(--muted)}@media(max-width:720px){aside{position:static;width:auto;padding:12px;border:0}aside nav{display:flex;flex-wrap:wrap;gap:14px}aside a{margin:0}main{margin:0;padding:15px}.lw-media-figure{top:0}}</style></head><body><aside><a href="/p/media-sync/index.html">返回流程与当前结果</a><nav id="nav"></nav></aside><main><header><h1>各类素材怎样按公共规范展示</h1><p>以下内容直接读取 framework 的正式媒体渲染器和已确认数据，只转换字段，没有再次生成正文</p></header><div id="examples"></div></main><script src="/reading-icons.js"></script><script src="/media-renderer.js"></script><script>const names={image:'图片',table:'表格',mermaid:'Mermaid',formula:'公式',code:'代码',model:'模型',video:'视频',audio:'音频',interactive:'交互内容'};fetch('resources.json').then(r=>r.json()).then(rows=>{rows.forEach((r,i)=>{const a=document.createElement('a');a.href='#'+r.id;a.textContent=names[r.kind];nav.append(a);const s=document.createElement('section');s.id=r.id;const h=document.createElement('h2');h.textContent=(i+1)+'. '+names[r.kind];s.append(h,LessonMedia.render(r,{prefix:'1.1.1',index:i+1}));examples.append(s)});document.body.dataset.ready='true'})</script></body></html>
