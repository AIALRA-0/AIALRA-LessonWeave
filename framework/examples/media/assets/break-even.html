<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px/1.6 system-ui;margin:12px;color:#29312c;background:#f7f8f4}label{display:grid;grid-template-columns:115px 1fr 52px;gap:8px}input{min-width:0;width:100%}output{white-space:nowrap}p{margin:9px 0}</style><div id="controls"></div><p id="result" aria-live="polite"></p><script>const fields=[['fixed','月固定成本',0,6000,100,3000],['price','单价',10,80,1,30],['variable','单位变动成本',0,80,1,18],['quantity','月销量',0,800,1,200]];for(const[id,name,min,max,step,value]of fields){let l=document.createElement('label');l.textContent=name;let i=document.createElement('input');Object.assign(i,{type:'range',id,min,max,step,value});let o=document.createElement('output');o.htmlFor=id;i.oninput=update;l.append(i,o);controls.append(l)}function update(){let v=Object.fromEntries(fields.map(([id])=>[id,Number(document.getElementById(id).value)]));document.querySelectorAll('output').forEach(o=>o.value=v[o.htmlFor]);let contribution=v.price-v.variable,profit=contribution*v.quantity-v.fixed,point=v.fixed===0?0:contribution>0?Math.ceil(v.fixed/contribution):null;result.textContent='收入 '+v.price*v.quantity+' 元；总成本 '+(v.fixed+v.variable*v.quantity)+' 元；利润 '+profit+' 元；持平销量 '+(point===null?'当前配置下增加正销量仍不足以收回固定成本':point+' 件')}update()</script></html>
