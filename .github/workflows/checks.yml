name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest
      - run: python -m compileall -q lessonweave deploy
      - run: node --check web/app.js && node --check web/workspace.js && node --check web/generation-progress.js && node --check web/metrics.js && node --check integrations/readweave/reader-component.js
      - run: bash -n deploy/install-vps.sh
