<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LessonWeave · 阶段预览</title><link rel="stylesheet" href="/app.css"><style>main{padding-top:35px}.inspect{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,1fr);gap:25px}details{margin:10px 0 10px 18px}summary{cursor:pointer;line-height:1.8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 monospace;padding:20px;margin:0;max-height:75vh;overflow:auto}#tree{padding:20px;max-height:75vh;overflow:auto}select{padding:10px;border:1px solid var(--line);border-radius:7px;margin:0 0 20px;background:var(--paper);color:var(--ink)}.node{border:0;background:none;color:var(--ink);text-align:left;font:14px/1.8 inherit;cursor:pointer}@media(max-width:700px){.inspect{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/">LessonWeave</a><a href="/">返回书架 ↗</a></header><main><span class="eyebrow">FOLLOW THE MATERIAL</span><h1 style="font-size:32px">每一步怎样接到下一步</h1><select id="stage" aria-label="选择阶段"><option value="material">01 材料树</option><option value="questions">02 问题树</option><option value="chapters">03 标题树</option><option value="transitions">04 承上启下</option><option value="usage">05 实际用量</option></select><div class="inspect"><section class="card" id="tree"></section><section class="card"><pre id="detail">选择左侧节点，查看它的实际数据与来源映射</pre></section></div></main><script src="/inspect.js"></script></body></html>
