<!doctype html>
<html lang="zh-CN" data-theme="light" data-app-loading><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LessonWeave · 工作台</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('lessonweave:theme')==='dark'?'dark':'light'}catch{}</script><style>html[data-app-loading] body>:not(#initial-loader){visibility:hidden}#initial-loader{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#eeeeec;color:#61615d}html[data-theme=dark] #initial-loader{background:#141414;color:#ababab}#initial-loader svg{width:72px;height:72px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:workspace-breathe 1.3s ease-in-out infinite alternate}@keyframes workspace-breathe{to{opacity:.45;transform:scale(.94)}}</style><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/workspace.css"></head>
<body><div id="initial-loader" role="status" aria-label="正在打开工作台"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 11c7-4 13-4 17 0v27c-4-4-10-4-17 0zM41 11c-7-4-13-4-17 0v27c4-4 10-4 17 0z"/><path d="M13 18c3-1 6-1 8 0M13 24c3-1 6-1 8 0M27 18c3-1 6-1 8 0M27 24c3-1 6-1 8 0"/></svg></div><header class="work-header"><button id="toggle-library" class="icon icon-control" aria-label="折叠文件树" title="折叠文件树" aria-expanded="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a class="brand" href="/">LessonWeave</a><span class="separator"></span><span id="current-location">文件</span><span class="spacer"></span><a id="architecture-link" class="icon-control" href="/architecture" target="_blank" rel="noopener" aria-label="流程与架构" title="流程与架构"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h6v6H3ZM15 15h6v6h-6ZM15 3h6v6h-6ZM9 6h6M6 9v9h9"/></svg></a><button id="theme" class="icon icon-control" aria-label="切换明暗主题" title="切换明暗主题"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3ZM12 3a9 9 0 0 1 0 18"/></svg></button></header>
<div class="work-layout"><aside id="library" aria-label="文件"><div class="library-heading"><strong>文件</strong><div class="library-heading-actions"><button id="new-folder" class="icon icon-control" aria-label="新建文件夹" title="新建文件夹"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5h6l2 2h10v13H3Z"/></svg></button><button id="new-project" class="icon-control" aria-label="生成读本" title="生成读本"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button></div></div><label class="search"><span>⌕</span><input id="tree-search" type="search" placeholder="查找材料与读本" aria-label="查找材料与读本"></label><div id="library-tree" role="tree" aria-label="材料树"></div><button id="show-trash" class="trash-entry icon-control" aria-label="回收站" title="回收站"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button></aside><div id="library-resizer" role="separator" tabindex="0" aria-label="调整材料树宽度" aria-orientation="vertical"></div>
<main class="work-main"><div class="document-toolbar"><h1 id="project-title">从材料开始一次学习</h1><span class="spacer"></span><button id="open-readweave" class="icon-control" disabled aria-label="在 ReadWeave 打开" title="正式 ReadWeave 尚未关联"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 4H4v16h16v-6"/></svg></button><a id="standalone-link" class="icon-control" hidden target="_blank" aria-label="单独阅读" title="单独阅读"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4zM20 4h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-3h3z"/></svg></a><a id="export-link" class="icon-control" hidden aria-label="导出阅读包" title="导出阅读包"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></a><button id="show-tasks" class="icon-control" aria-label="生成任务记录" title="生成任务记录" aria-expanded="false"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h3m3 0h10M4 12h3m3 0h10M4 19h3m3 0h10"/></svg></button></div><div id="empty-workspace" class="empty-workspace"><div class="empty-symbol">⌘</div><h2>选择左侧读本，或在文件夹中生成</h2><p>原材料、讲解、术语和学习笔记会留在同一个项目中</p><button id="empty-generate" class="primary">选择材料并生成</button></div><section id="generation-workspace" hidden aria-label="当前文件的生成进度"></section><div id="reader" hidden></div><section id="trash-view" hidden><h2>回收站</h2><p>恢复后会回到原来的文件夹，原文件夹已被移除时回到根目录</p><div id="trash-list"></div></section><section id="task-panel" hidden aria-label="生成任务记录"><header><strong>生成任务</strong><span id="task-summary" class="help"></span></header><div id="tasks"></div></section></main></div>
<div id="work-status" role="status" aria-live="polite"></div>
<dialog id="generate-dialog"><form id="generate-form"><header><h2>生成新的学习读本</h2><button type="button" data-close="generate-dialog" class="icon" aria-label="关闭生成窗口">×</button></header><label>生成到哪个文件夹<select name="folder_id" id="generate-folder"></select></label><label>材料类型<select name="kind" id="material-kind"><option value="file">PDF 文件</option><option value="url">网页链接</option><option value="repository">项目 ZIP</option></select></label><label id="material-url-label" hidden>网页地址<input name="material" type="url" placeholder="https://example.com/article"></label><label id="material-file-label">上传材料<input id="material-file" type="file" accept=".pdf"></label><label>读本名称<input name="name" maxlength="150" placeholder="留空时使用文件名或网页名称"></label><label>希望重点理解什么<textarea name="system_prompt" rows="3" placeholder="可以留空，也可以写下学习目标"></textarea></label><progress id="upload-progress" max="100" value="0" hidden></progress><p id="generate-status" class="help" role="status"></p><footer><button type="button" data-close="generate-dialog">取消</button><button id="generate-submit" type="submit" class="primary">确认并开始生成</button></footer></form></dialog>
<dialog id="action-dialog"><form id="action-form"><header><h2 id="action-title"></h2><button type="button" data-close="action-dialog" class="icon" aria-label="关闭操作窗口">×</button></header><p id="action-description"></p><label id="action-name-label">名称<input id="action-name" maxlength="150"></label><label id="action-parent-label">目标文件夹<select id="action-parent"></select></label><p id="action-error" class="danger" role="status"></p><footer><button type="button" data-close="action-dialog">取消</button><button id="action-confirm" class="primary" type="submit">确认</button></footer></form></dialog>
<div id="tree-menu" role="menu" hidden><button role="menuitem" data-menu="folder">新建文件夹</button><button role="menuitem" data-menu="generate">生成到这里</button><hr><button role="menuitem" data-menu="rename">重命名</button><button role="menuitem" data-menu="move">移动</button><button role="menuitem" data-menu="trash" class="danger">移入回收站</button></div>
<script type="module" src="/workspace.js"></script></body></html>
